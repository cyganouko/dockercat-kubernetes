apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: dockercat
    component: backend
  annotations:
    project: dockercat-kubernetes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockercat
      component: backend
  template:
    metadata:
      labels:
        app: dockercat
        component: backend
    spec:
      containers:
        - name: backend
          image: cyganouko/dockercat-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/yolomy
            - name: PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
