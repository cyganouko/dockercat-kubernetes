apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: dockercat
    component: database
  annotations:
    project: dockercat-kubernetes
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: dockercat
      component: database
  template:
    metadata:
      labels:
        app: dockercat
        component: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
